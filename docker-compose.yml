x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-crm}
    volumes:
      - crm-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-crm}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: gisuldocker/crm-migrate:${CRM_IMAGE_TAG:-latest}
    logging: *logging
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ALLOW_REMOTE_DB: ${ALLOW_REMOTE_DB:-}
      NODE_TLS_REJECT_UNAUTHORIZED: ${NODE_TLS_REJECT_UNAUTHORIZED:-}
    volumes:
      - ./.env:/app/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: gisuldocker/crm-api:${CRM_IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      ALLOWED_SIGN_IN: ${ALLOWED_SIGN_IN:?set ALLOWED_SIGN_IN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
      API_URL: ${API_URL:-http://localhost:3001}
      APP_URL: ${APP_URL:-http://localhost:3000}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      AGENT_URL: ${AGENT_URL:-http://agent:2000}
      AGENT_BRIDGE_SECRET: ${AGENT_BRIDGE_SECRET:?set AGENT_BRIDGE_SECRET}
      CRON_SECRET: ${CRON_SECRET:-}
      REDIS_URL: ${REDIS_URL:-}
      BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-v1}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-gpt-4o}
      CRM_TELEMETRY_DISABLED: ${CRM_TELEMETRY_DISABLED:-1}
      NODE_TLS_REJECT_UNAUTHORIZED: ${NODE_TLS_REJECT_UNAUTHORIZED:-}
    ports:
      - "127.0.0.1:3002:3001"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  app:
    image: gisuldocker/crm-app:${CRM_IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      ALLOWED_SIGN_IN: ${ALLOWED_SIGN_IN:?set ALLOWED_SIGN_IN}
      API_URL: ${API_URL:-http://localhost:3002}
      APP_URL: ${APP_URL:-http://localhost:3010}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      AGENT_URL: ${AGENT_URL:-http://agent:2000}
      AGENT_BRIDGE_SECRET: ${AGENT_BRIDGE_SECRET:?set AGENT_BRIDGE_SECRET}
      LINKEDIN_SCRAPER_URL: ${LINKEDIN_SCRAPER_URL:-http://linkedin-scraper:6363}
      LINKEDIN_SCRAPER_VIEWER_URL: ${LINKEDIN_SCRAPER_VIEWER_URL:-}
      LEADS_PIPELINE_URL: ${LEADS_PIPELINE_URL:-http://leads-pipeline:8501}
      OUTREACH_URL: ${OUTREACH_URL:-http://outreach-web:3000}
      OUTREACH_EMAIL: ${OUTREACH_EMAIL:-}
      OUTREACH_PASSWORD: ${OUTREACH_PASSWORD:-}
      CRM_TELEMETRY_DISABLED: ${CRM_TELEMETRY_DISABLED:-1}
      NODE_TLS_REJECT_UNAUTHORIZED: ${NODE_TLS_REJECT_UNAUTHORIZED:-}
    ports:
      - "127.0.0.1:3010:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/', { redirect: 'manual' }).then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy

  agent:
    image: gisuldocker/crm-agent:${CRM_IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    environment:
      NODE_ENV: production
      AGENT_PORT: 2000
      DATABASE_URL: ${DATABASE_URL}
      AGENT_BRIDGE_SECRET: ${AGENT_BRIDGE_SECRET:?set AGENT_BRIDGE_SECRET}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:?set AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:?set AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-v1}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-gpt-4o}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN:-}
      CRM_TELEMETRY_DISABLED: ${CRM_TELEMETRY_DISABLED:-1}
      NODE_TLS_REJECT_UNAUTHORIZED: ${NODE_TLS_REJECT_UNAUTHORIZED:-}
    ports:
      - "127.0.0.1:2000:2000"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:2000/eve/v1/info').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  outreach-mongo:
    image: mongo:8.0
    profiles: [outreach]
    restart: unless-stopped
    logging: *logging
    volumes:
      - outreach-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  outreach-setup:
    image: gisuldocker/outreach-engine:${OUTREACH_IMAGE_TAG:-latest}
    profiles: [outreach]
    logging: *logging
    env_file:
      - path: ./outreach.env
        required: false
    environment:
      MONGODB_URI: mongodb://outreach-mongo:27017/outreach
    command: ["sh", "-c", "npm run db:indexes && npm run seed"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      outreach-mongo:
        condition: service_healthy

  outreach-web:
    image: gisuldocker/outreach-engine:${OUTREACH_IMAGE_TAG:-latest}
    profiles: [outreach]
    logging: *logging
    env_file:
      - path: ./outreach.env
        required: false
    environment:
      MONGODB_URI: mongodb://outreach-mongo:27017/outreach
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3020:3000"
    depends_on:
      outreach-setup:
        condition: service_completed_successfully

  outreach-worker:
    image: gisuldocker/outreach-engine:${OUTREACH_IMAGE_TAG:-latest}
    profiles: [outreach]
    logging: *logging
    env_file:
      - path: ./outreach.env
        required: false
    environment:
      MONGODB_URI: mongodb://outreach-mongo:27017/outreach
    command: ["node_modules/.bin/tsx", "src/worker/index.ts"]
    init: true
    restart: unless-stopped
    stop_grace_period: 40s
    healthcheck:
      disable: true
    depends_on:
      outreach-setup:
        condition: service_completed_successfully

  linkedin-mongo:
    image: mongo:7
    profiles: [linkedin]
    restart: unless-stopped
    logging: *logging
    volumes:
      - linkedin-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  linkedin-scraper:
    image: ${LINKEDIN_SCRAPER_IMAGE:-gisuldocker/linkedin-scrapper:latest}
    build: ./services/linkedin-scraper
    profiles: [linkedin]
    restart: unless-stopped
    logging: *logging
    shm_size: 2gb
    env_file:
      - path: ./linkedin-scraper.env
        required: false
    environment:
      PORT: "6363"
      MONGODB_URI: mongodb://linkedin-mongo:27017
      MONGODB_DB: linkedin_scrapper
      HEADLESS: "false"
      IN_DOCKER: "true"
      DISPLAY: ":99"
      SEND_MESSAGES: "false"
    volumes:
      - linkedin-auth:/app/.auth
      - linkedin-output:/app/output
      - linkedin-data:/app/data
    ports:
      - "127.0.0.1:6363:6363"
      - "127.0.0.1:6080:6080"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:6363/api/connection-types').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      linkedin-mongo:
        condition: service_healthy

  leads-reacher:
    image: ${LEADS_REACHER_IMAGE:-reacherhq/backend:v0.11.8}
    profiles: [leads]
    restart: unless-stopped
    logging: *logging
    environment:
      RCH__HELLO_NAME: ${LEADS_REACHER_HELLO_NAME:-localhost}
      RCH__FROM_EMAIL: ${LEADS_REACHER_FROM_EMAIL:-verify@localhost}

  leads-pipeline:
    image: ${LEADS_PIPELINE_IMAGE:-gisuldocker/leads-pipeline:${CRM_IMAGE_TAG:-latest}}
    build: ./services/leads-pipeline
    profiles: [leads]
    restart: unless-stopped
    logging: *logging
    init: true
    shm_size: 1gb
    environment:
      TZ: ${LEADS_PIPELINE_TZ:-Asia/Kolkata}
      REACHER_URL: http://leads-reacher:8080/v0/check_email
    volumes:
      - leads-data:/app/data
    ports:
      - "127.0.0.1:8502:8501"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8501/api/health', timeout=4).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      - leads-reacher

volumes:
  crm-postgres:
  outreach-mongo:
  linkedin-mongo:
  linkedin-auth:
  linkedin-output:
  linkedin-data:
  leads-data:
