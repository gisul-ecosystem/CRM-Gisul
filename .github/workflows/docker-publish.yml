name: Docker build and push

on:
  workflow_dispatch:
  push:
    branches: [main, release]

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOCKERHUB_USERNAME: gisuldocker

jobs:
  build-push:
    name: ${{ matrix.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            target: api
            image: crm-api
          - service: app
            target: app
            image: crm-app
          - service: agent
            target: agent
            image: crm-agent
          - service: migrate
            target: migrate
            image: crm-migrate
          - service: linkedin-scraper
            image: linkedin-scrapper
            context: services/linkedin-scraper
            file: services/linkedin-scraper/Dockerfile
          - service: leads-pipeline
            image: leads-pipeline
            context: services/leads-pipeline
            file: services/leads-pipeline/Dockerfile

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Choose tags
        id: tags
        env:
          IMAGE: gisuldocker/${{ matrix.image }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          version=$(jq -r .version package.json)

          {
            echo "list<<EOF"
            echo "$IMAGE:sha-$SHA"
            case "$BRANCH" in
              release)
                echo "$IMAGE:latest"
                echo "$IMAGE:$version"
                ;;
              main)
                echo "$IMAGE:main"
                ;;
            esac
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve API URL
        id: api
        run: |
          if [ -n "${{ vars.DOCKER_API_URL }}" ]; then
            echo "url=${{ vars.DOCKER_API_URL }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://api-crm.gisul.co.in" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.file || 'docker/Dockerfile' }}
          target: ${{ matrix.target }}
          push: true
          platforms: linux/amd64
          build-args: |
            API_URL=${{ steps.api.outputs.url }}
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
