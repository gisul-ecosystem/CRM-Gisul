name: Docker build and push

on:
  workflow_dispatch:
  push:
    branches: [main, release]

env:
  DOCKERHUB_USERNAME: gisuldocker

jobs:
  build-push:
    name: ${{ matrix.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            target: api
            image: crm-api
          - service: app
            target: app
            image: crm-app
          - service: agent
            target: agent
            image: crm-agent
          - service: migrate
            target: migrate
            image: crm-migrate

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Read version
        id: pkg
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Resolve API URL
        id: api
        run: |
          if [ -n "${{ vars.DOCKER_API_URL }}" ]; then
            echo "url=${{ vars.DOCKER_API_URL }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://api.gisul.co.in" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          push: true
          platforms: linux/amd64
          build-args: |
            API_URL=${{ steps.api.outputs.url }}
          tags: |
            gisuldocker/${{ matrix.image }}:latest
            gisuldocker/${{ matrix.image }}:${{ steps.pkg.outputs.version }}
            gisuldocker/${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
